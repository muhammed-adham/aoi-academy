<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | AOI Academy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%9B%3C/text%3E%3C/svg%3E">
    <meta name="description" content="The latest announcements, success stories, partnerships and events from AOI Academy.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%9B%3C/text%3E%3C/svg%3E">
    <script>

      try { if (localStorage.getItem("lang") === "ar") { var d = document.documentElement; d.lang = "ar"; d.dir = "rtl"; d.classList.add("lang-loading"); } } catch (e) { }
    </script>
    <link href="./assets/css/loading.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="./assets/css/main.css" rel="stylesheet">
    <link href="./assets/css/pages/news.css" rel="stylesheet">
</head>

<body>
    <div id="header"></div>

    <main id="main" class="page" tabindex="-1">
        <div class="page-header">
            <div class="container">
                <h1 class="page-title">Latest News</h1>
                <p class="page-subtitle">Stay updated with our latest announcements and achievements</p>
            </div>
        </div>

        <section class="section">
            <div class="container">
                <div class="news-container" id="news-container">

                </div>
            </div>
        </section>
    </main>

    <div class="modal fade" id="imageLightbox" tabindex="-1" aria-hidden="true" aria-label="Photo viewer">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="lightbox-stage">
                    <button type="button" class="lightbox-close" id="lightbox-close" data-bs-dismiss="modal" aria-label="Close"><i class="fas fa-xmark" aria-hidden="true"></i></button>
                    <button type="button" class="lightbox-btn lightbox-prev" id="lightbox-prev" data-action="step-lightbox" data-step="-1"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
                    <img id="lightbox-img" src="" alt="">
                    <button type="button" class="lightbox-btn lightbox-next" id="lightbox-next" data-action="step-lightbox" data-step="1"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
                </div>
                <div class="lightbox-caption">
                    <div id="lightbox-caption-text"></div>
                    <span class="count" id="lightbox-count"></span>
                </div>
            </div>
        </div>
    </div>
    <div id="footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="./assets/js/pages/news.js"></script>
</body>

</html>
