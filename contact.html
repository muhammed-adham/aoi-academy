<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | AOI Academy</title>
    <meta name="description" content="Contact AOI Academy: send us a message, find our address, phone, email and office hours.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%9B%3C/text%3E%3C/svg%3E">
    <script>

      try { if (localStorage.getItem("lang") === "ar") { var d = document.documentElement; d.lang = "ar"; d.dir = "rtl"; d.classList.add("lang-loading"); } } catch (e) { }
    </script>
    <link href="./assets/css/loading.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="./assets/css/main.css" rel="stylesheet">
</head>

<body>
    <div id="header"></div>

    <main id="main" class="page" tabindex="-1">
    <div class="page-header">
        <div class="container">
            <h1 class="page-title">Contact Us</h1>
            <p class="page-subtitle">Get in touch with our team</p>
        </div>
    </div>

    <section class="section">
        <div class="container">
            <div class="row g-5">
                <div class="col-lg-8">
                    <div class="form-custom">
                        <h2 class="h3 text-primary-custom mb-4">Send us a Message</h2>
                        <form data-submit="contact">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="firstName" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="lastName" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="phone">
                            </div>
                            <div class="mb-3">
                                <label for="subject" class="form-label">Subject</label>
                                <select class="form-control" id="subject" required>
                                    <option value="">Select a subject</option>
                                    <option value="Course Inquiry">Course Inquiry</option>
                                    <option value="Room Booking">Room Booking</option>
                                    <option value="General Question">General Question</option>
                                    <option value="Technical Support">Technical Support</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" rows="5" required></textarea>
                            </div>
                            <button type="submit" class="btn-card">
                                Send Message <i class="fas fa-paper-plane ms-2" aria-hidden="true"></i>
                            </button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card card-custom h-100">
                        <div class="card-body">
                            <h2 class="h5 text-primary-custom mb-4">Get in Touch</h2>
                            <div class="mb-4">
                                <h3 class="h6"><i class="fas fa-map-marker-alt text-primary-custom me-2"></i><span>Address</span></h3>
                                <p class="text-muted">123 Training Street<br>Business District<br>Cairo, Egypt</p>
                            </div>
                            <div class="mb-4">
                                <h3 class="h6"><i class="fas fa-phone text-primary-custom me-2"></i><span>Phone</span></h3>
                                <p class="text-muted"><bdi dir="ltr">+20 2 1234 5678</bdi></p>
                            </div>
                            <div class="mb-4">
                                <h3 class="h6"><i class="fas fa-envelope text-primary-custom me-2"></i><span>Email</span></h3>
                                <p class="text-muted"><bdi dir="ltr">info@elitetraining.com</bdi></p>
                            </div>
                            <div class="mb-4">
                                <h3 class="h6"><i class="fas fa-clock text-primary-custom me-2"></i><span>Office Hours</span></h3>
                                <p class="text-muted">Monday - Friday: 9:00 AM - 6:00 PM<br>Saturday: 9:00 AM - 2:00 PM<br>Sunday: Closed</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    </main>

    <div id="footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="./assets/js/pages/contact.js"></script>
</body>

</html>
