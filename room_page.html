<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Details | AOI Academy</title>
    <meta name="description" content="Room and lab details, gallery, capacity and pricing at AOI Academy. Book the space you need.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%9B%3C/text%3E%3C/svg%3E">
    <script>

      try { if (localStorage.getItem("lang") === "ar") { var d = document.documentElement; d.lang = "ar"; d.dir = "rtl"; d.classList.add("lang-loading"); } } catch (e) { }
    </script>
    <link href="./assets/css/loading.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="./assets/css/main.css" rel="stylesheet">
    <link href="./assets/css/pages/room-page.css" rel="stylesheet">

</head>

<body>
    <div id="header"></div>

    <main id="main" class="page" tabindex="-1">
    <div class="page-header">
        <div class="container">
            <h1 class="page-title">Conference Rooms</h1>
            <p class="page-subtitle">Premium spaces for your meetings and events</p>
        </div>
    </div>

    <section class="section">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div id="main-room-card" class="card card-custom fade-in-up">
                        <div class="room-image">
                            <img id="main-room-image" src="" alt="Room Image" class="img-fluid w-100 room-main-image"
                               >
                        </div>

                        <div id="room-gallery" class="d-flex justify-content-center flex-wrap room-gallery"></div>

                        <div class="card-body room-details">
                            <h2 id="main-room-title" class="card-title mb-3"></h2>
                            <p id="main-room-description" class="card-text mb-4"></p>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <h3 class="h6 text-primary-custom mb-2">
                                        <i class="fas fa-star feature-icon"></i>Features
                                    </h3>
                                    <div id="main-room-features"></div>
                                </div>
                                <div class="col-md-6">
                                    <h3 class="h6 text-primary-custom mb-2">
                                        <i class="fas fa-info-circle feature-icon"></i>Details
                                    </h3>
                                    <div id="main-room-details"></div>
                                </div>
                            </div>

                            <div class="d-flex gap-3 flex-wrap">
                                <button type="button" class="btn btn-card" data-action="book-room">
                                    <i class="fas fa-calendar-check me-2"></i>Book Now
                                </button>
                                <a class="btn btn-outline-secondary" href="contact.html">
                                    <i class="fa-solid fa-comments me-2"></i>Contact Us
                                </a>
                                <button type="button" class="btn btn-outline-secondary" data-action="share-room">
                                    <i class="fas fa-share me-2"></i>Share
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="sticky-top">
                        <div class="available-rooms-header">
                            <h2 class="h5 text-primary-custom mb-1">
                                <i class="fas fa-door-open me-2"></i>Available Rooms
                            </h2>
                            <small class="text-muted">Click any room to view details</small>
                        </div>
                        <div id="rooms-container" class="overflow-y-auto room-list">

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    </main>

    <div id="footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="./assets/js/pages/room-page.js"></script>
</body>

</html>
