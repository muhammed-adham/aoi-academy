<!-- Courses Page -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOI Academy</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="./assets/style.css" rel="stylesheet">
</head>

<body>
    <div id="header"></div>

    <div id="courses-page" class="page ">
        <div class="page-header">
            <div class="container">
                <h1 class="page-title">Our Courses</h1>
                <p class="page-subtitle">Comprehensive training programs designed for your success</p>
            </div>
        </div>

        <section class="section">
            <div class="container">
                <div class="row g-4" id="courses_container">
                    <!-- Courses will be dynamically inserted here -->
                </div>
            </div>
    </div>

    <div id="footer"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/main.js"></script>
    <script src="./assets/courses.js"></script>

    <!-- // Courses data -->
    <script>

        function renderCourses(courses) {
            const container = document.getElementById('courses_container');
            container.innerHTML = '';

            courses.forEach(course => {
                const courseCard = document.createElement('div');
                courseCard.className = 'col-lg-4 col-md-6'; ``
                courseCard.innerHTML = `
                    <div class="card card-custom">
                        <img src="${course.image}" class="card-img-top" alt="${course.title}">
                        <div class="card-body">
                            <h5 class="card-title">${course.title}</h5>
                            <b>${course.instructor}</b>
                            <p class="card-text" style="height:100px; overflow:hidden;">${course.description}</p>
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="badge bg-primary-custom">${course.duration}</span>
                                <span class="text-primary-custom fw-bold">$${course.price}</span>
                            </div>
                            <button class="btn btn-card w-100" onclick="handleCTAClick('course', '${course.id}')">
                                View Details
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(courseCard);
            })
        }

        renderCourses(coursesData)
    </script>
</body>

</html>
