<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training Videos | AOI Academy</title>
    <meta name="description" content="Watch highlights from AOI Academy courses and events: analytics, leadership, marketing, project management and more.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%9B%3C/text%3E%3C/svg%3E">
    <script>

      try { if (localStorage.getItem("lang") === "ar") { var d = document.documentElement; d.lang = "ar"; d.dir = "rtl"; d.classList.add("lang-loading"); } } catch (e) { }
    </script>
    <link href="./assets/css/loading.css" rel="stylesheet">
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="./assets/css/main.css" rel="stylesheet">
    <link href="./assets/css/pages/videos.css" rel="stylesheet">
  </head>

<body>
    <div id="header"></div>

    <main id="main" class="page" tabindex="-1">
        <div class="page-header">
            <div class="container">
                <h1 class="page-title">Training Videos</h1>
                <p class="page-subtitle">Watch highlights from our courses and events</p>
            </div>
        </div>

        <section class="section">
            <div class="container">
                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="card card-custom">
                            <div class="ratio ratio-16x9">
                                <iframe id="main-video" src="" title="Featured Video" allowfullscreen></iframe>
                            </div>
                            <div class="card-body">
                                <h2 id="main-video-title" class="h4 card-title"></h2>
                                <div class="mb-3" aria-live="polite">
                                    <span id="main-video-views" class="yt-views" data-state="loading">
                                        <i class="fas fa-users" aria-hidden="true"></i><span class="yt-views-text">0 views</span>
                                    </span>
                                </div>
                                <hr>
                                <p id="main-video-description" class="card-text"></p>
                            </div>
                        </div>
                    </div>

                    <div id="videos-container" class="col-lg-4 pt-2 overflow-y-auto videos-list">
                        <div class="videos-head">
                            <h2 class="h5 text-primary-custom mb-3">More Videos</h2>
                            <div class="video-search">
                                <i class="fas fa-magnifying-glass video-search-icon" aria-hidden="true"></i>
                                <input type="search" id="video-search" class="form-control" placeholder="Search videos"
                                    aria-label="Search videos" autocomplete="off">
                                <button type="button" class="video-search-clear" id="video-search-clear" data-action="clear-search"
                                    aria-label="Clear search" hidden>
                                    <i class="fas fa-xmark" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        <p class="videos-empty" id="videos-empty" role="status" hidden>No videos match your search.</p>

                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="./assets/js/pages/videos.js"></script>
</body>

</html>
